<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Builder - Custom Card Type 5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-[360px] bg-white rounded-2xl border border-teal-100 shadow-sm hover:shadow-md transition-all duration-300 overflow-hidden font-sans">
      
      <div class="relative bg-gradient-to-b from-teal-50/40 to-transparent p-4 flex flex-col items-center justify-center min-h-[220px]">
        
        <div class="absolute top-3 left-3 flex flex-wrap gap-1 max-w-[70%]">
          <span class="text-[10px] font-bold tracking-wider uppercase bg-teal-700 text-white px-2 py-0.5 rounded-md shadow-sm">
            FREE SHIPPING
          </span>
          <span class="text-[10px] font-bold tracking-wider uppercase bg-emerald-600 text-white px-2 py-0.5 rounded-md shadow-sm">
            BOGO
          </span>
          <span class="text-[10px] font-bold tracking-wider uppercase bg-amber-500 text-white px-2 py-0.5 rounded-md shadow-sm">
            CAMPAIGN
          </span>
        </div>

        <div class="absolute top-3 right-3 w-10 h-10 rounded-full border-2 border-emerald-500 bg-white flex items-center justify-center shadow-sm">
          <span class="text-xs font-black text-emerald-600">20%</span>
        </div>

        <div class="my-6 transform hover:scale-105 transition-transform duration-300">
          <div class="bg-gradient-to-tr from-orange-500 to-red-500 text-white text-xl font-extrabold px-6 py-4 rounded-xl shadow-lg tracking-wide text-center select-none">
            ইজি ব্যবসা
          </div>
        </div>
      </div>

      <div class="p-5 bg-slate-50/80 border-t border-slate-100">
        
        <h3 class="text-lg font-bold text-slate-800 leading-tight hover:text-teal-700 transition-colors cursor-pointer line-clamp-2">
          Premium Product Name
        </h3>

        <div class="flex flex-wrap gap-1.5 mt-2.5">
          <span class="text-xs font-medium text-teal-800 bg-teal-100/70 px-2.5 py-0.5 rounded-full">
            Brand Name
          </span>
          <span class="text-xs font-normal text-slate-600 bg-slate-200/60 px-2 py-0.5 rounded-md">
            Category 1
          </span>
          <span class="text-xs font-normal text-slate-600 bg-slate-200/60 px-2 py-0.5 rounded-md">
            Category 2
          </span>
        </div>

        <div class="mt-4 pt-3 border-t border-dashed border-slate-200 flex justify-between items-center">
          <div class="flex flex-col">
            <span class="text-xs text-slate-400 line-through">৳500</span>
            <span class="text-xl font-black text-teal-700">
              ৳400<span class="text-xs font-normal text-slate-500">/pc</span>
            </span>
          </div>
          
          <div class="text-right text-[11px] text-slate-500 bg-white p-1.5 rounded-lg border border-slate-100 shadow-2xs">
            <div>Min: <span class="font-semibold text-slate-700">5 pc</span></div>
            <div>Max: <span class="font-semibold text-slate-700">100 pc</span></div>
          </div>
        </div>

        <div class="mt-5 flex items-center justify-between gap-3">
          
          <div class="flex items-center bg-white border border-slate-200 rounded-xl p-1 shadow-2xs">
            <button class="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-95 transition-all flex items-center justify-center font-bold">
              −
            </button>
            <span class="px-3 text-sm font-bold text-slate-700 min-w-[24px] text-center select-none">
              5
            </span>
            <button class="w-8 h-8 rounded-lg bg-teal-50 text-teal-600 hover:bg-teal-100 active:scale-95 transition-all flex items-center justify-center font-bold">
              +
            </button>
          </div>

          <div class="flex items-center gap-2 flex-1 justify-end">
            <button class="bg-teal-700 hover:bg-teal-800 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex-1 text-center tracking-wide">
              BUY
            </button>
            
            <button class="p-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-teal-600 active:scale-95 transition-all shadow-2xs" title="Add to Cart">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 0a2 2 0 100 4 2 2 0 000-4z" />
              </svg>
            </button>
          </div>

        </div>

      </div>
    </div>

</body>
</html>
